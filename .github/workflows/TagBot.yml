name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create package tag and release
        # Push v0.3.0 manually so tag-triggered docs and container workflows run.
        uses: JuliaRegistries/TagBot@14d7645453716d7a2f09b1da0504a024f97462a1 # v1.25.10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
