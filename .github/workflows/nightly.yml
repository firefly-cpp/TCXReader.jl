name: Julia nightly

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia nightly / Linux (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Julia nightly
        uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: nightly

      - name: Restore Julia caches
        uses: julia-actions/cache@e32267b41e0fa7df82a3d53e8c7273620d52c586 # v3.4.0

      - name: Build package
        uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1

      - name: Precompile package
        run: julia --project=. --startup-file=no -e 'using Pkg; Pkg.precompile()'

      - name: Run tests
        uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1
