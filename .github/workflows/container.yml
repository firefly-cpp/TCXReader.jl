name: Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: tcxreader:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test CLI and non-root runtime
        shell: bash
        run: |
          docker run --rm tcxreader:test
          docker run --rm tcxreader:test --help
          docker run --rm tcxreader:test /app/example_data/15.tcx
          test "$(docker run --rm --entrypoint=id tcxreader:test -u)" != "0"

      - name: Smoke-test CSV export
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/tcxreader-output"
          chmod a+rwx "${RUNNER_TEMP}/tcxreader-output"
          docker run --rm \
            --mount "type=bind,src=${RUNNER_TEMP}/tcxreader-output,dst=/output" \
            tcxreader:test --csv /output/activity.csv /app/example_data/15.tcx
          test -s "${RUNNER_TEMP}/tcxreader-output/activity.csv"

  publish:
    name: Publish multi-platform image
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tcxreader
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=TCXReader.jl
            org.opencontainers.image.description=Read and summarize Garmin TCX activity files with Julia

      - name: Build and publish image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
