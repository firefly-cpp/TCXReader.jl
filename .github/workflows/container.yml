name: Container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build local image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: false
          tags: tcxreader:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test CLI and non-root runtime
        shell: bash
        run: |
          docker run --rm tcxreader:test
          docker run --rm tcxreader:test --help
          docker run --rm tcxreader:test /app/example_data/15.tcx
          test "$(docker run --rm --entrypoint=id tcxreader:test -u)" != "0"

      - name: Smoke-test CSV export
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/tcxreader-output"
          chmod a+rwx "${RUNNER_TEMP}/tcxreader-output"
          docker run --rm \
            --mount "type=bind,src=${RUNNER_TEMP}/tcxreader-output,dst=/output" \
            tcxreader:test --csv /output/activity.csv /app/example_data/15.tcx
          test -s "${RUNNER_TEMP}/tcxreader-output/activity.csv"

  publish-platform:
    name: Build and push ${{ matrix.platform }}
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tcxreader
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=TCXReader.jl
            org.opencontainers.image.description=Read and summarize Garmin TCX activity files with Julia

      - name: Build and push platform image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Record image digest
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${IMAGE_DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb4ef322b7584ed70f98c1e5e5c9c96700664 # v7.0.1
        with:
          name: container-digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: publish-platform
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/tcxreader
    steps:
      - name: Download platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate release tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create and inspect multi-platform manifest
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          digest_files=("${RUNNER_TEMP}"/digests/*)
          if (( ${#digest_files[@]} != 2 )); then
            echo "Expected two platform digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          tags=()
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "${tag}" ]]; then
              tags+=("${tag}")
              tag_args+=(--tag "${tag}")
            fi
          done <<< "${IMAGE_TAGS}"

          if (( ${#tags[@]} == 0 )); then
            echo "No release tags were generated" >&2
            exit 1
          fi

          sources=()
          for digest_file in "${digest_files[@]}"; do
            sources+=("${IMAGE_NAME}@sha256:$(basename "${digest_file}")")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[0]}"
